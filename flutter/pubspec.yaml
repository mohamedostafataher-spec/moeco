name: moeco
description: MoEco - Egypt Eco. Personal carbon footprint, complaints organizer, and local projects tracker.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  intl: any  # pinned by flutter_localizations; let pub solve
  http: ^1.2.2
  url_launcher: ^6.2.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
