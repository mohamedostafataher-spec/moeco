name: moeco
description: MoEco - Egypt Eco. Personal carbon footprint, complaints organizer, and local projects tracker.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  intl: any  # pinned by flutter_localizations; let pub solve
  http: ^1.2.2
  url_launcher: ^6.2.5
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  xml: ^6.5.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
