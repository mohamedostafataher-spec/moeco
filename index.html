
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MoEco | منصة الأثر البيئي والعمل المجتمعي في مصر</title>
    <meta name="description" content="MoEco: منصة عربية لمتابعة استهلاك الكهرباء والمياه، حساب الأثر البيئي، وتنظيم الشكاوى والخدمات المحلية في مصر." />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b6b54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script>
      // The app uses hash routing; rewrite path-style deep links (/calculator)
      // to hash routes (#/calculator) so shared links land on the right page.
      (function () {
        var p = window.location.pathname;
        if (p && p !== '/' && !p.startsWith('/assets') && !p.includes('.')) {
          window.location.replace('/#' + p + window.location.search);
        }
      })();
    </script>
    <style>
      body {
        font-family: 'Cairo', 'Inter', sans-serif;
        background-color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
      }
      .font-arabic { font-family: 'Cairo', sans-serif; }
      .rtl { direction: rtl; }
      .ltr { direction: ltr; }
      @media (max-width: 768px) {
        .mobile-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
