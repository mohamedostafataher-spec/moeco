name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npx vite build
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: |
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 resources/icon-only.svg -o assets/icon-only.png
          rsvg-convert -w 1024 -h 1024 resources/icon-foreground.svg -o assets/icon-foreground.png
          rsvg-convert -w 1024 -h 1024 resources/icon-background.svg -o assets/icon-background.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a8a5c'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moeco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to download repo
        env:
          DL_TOKEN: ${{ secrets.DL_TOKEN }}
        run: |
          rsvg-convert -w 256 -h 256 resources/icon-only.svg -o /tmp/icon.png
          git clone https://x-access-token:${DL_TOKEN}@github.com/mohamedostafataher-spec/moeco-dl.git /tmp/dl
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/dl/moeco.apk
          cp resources/download-index.html /tmp/dl/index.html
          cp /tmp/icon.png /tmp/dl/icon.png
          cd /tmp/dl
          git config user.name "moeco-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "Publish APK $GITHUB_SHA" || echo "nothing to commit"
          git push origin HEAD:main
