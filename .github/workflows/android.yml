name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npx vite build
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: |
          mkdir -p assets
          base64 -d resources/icon-src.b64 > /tmp/icon-src.jpg
          convert /tmp/icon-src.jpg -resize 1024x1024 assets/icon-only.png
          convert assets/icon-only.png \( -size 1024x1024 xc:black -fill white -draw "circle 512,512 512,40" -blur 0x60 \) -alpha off -compose copy_opacity -composite -resize 760x760 /tmp/fg760.png
          convert -size 1024x1024 xc:none /tmp/fg760.png -gravity center -composite assets/icon-foreground.png
          convert -size 1024x1024 radial-gradient:'#0b5a47-#032a22' assets/icon-background.png
          cp assets/icon-only.png resources/icon-only.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a8a5c'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: moeco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to download repo
        env:
          DL_TOKEN: ${{ secrets.DL_TOKEN }}
        run: |
          convert resources/icon-only.png -resize 256x256 /tmp/icon.png
          git clone https://x-access-token:${DL_TOKEN}@github.com/mohamedostafataher-spec/moeco-dl.git /tmp/dl
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/dl/moeco.apk
          cp resources/download-index.html /tmp/dl/index.html
          cp /tmp/icon.png /tmp/dl/icon.png
          cd /tmp/dl
          git config user.name "moeco-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "Publish APK $GITHUB_SHA" || echo "nothing to commit"
          git push origin HEAD:main
