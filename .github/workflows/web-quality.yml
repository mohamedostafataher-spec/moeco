name: web-quality

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'components/**'
      - 'context/**'
      - 'services/**'
      - 'server/**'
      - 'App.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/web-quality.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Dependency vulnerability audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
