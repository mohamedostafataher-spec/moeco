name: flutter-apk

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms android --project-name moeco .
      - name: Set application id, label, minSdk and INTERNET permission
        run: |
          sed -i 's/applicationId = "com.example.moeco"/applicationId = "eg.moeco.app"/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          # google_mlkit trips R8 full mode (missing script recognizer classes);
          # minification is off for release until a kept-rules file is maintained.
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          # flutter_local_notifications requires core library desugaring
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          sed -i 's/android:label="moeco"/android:label="MoEco"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' android/app/src/main/AndroidManifest.xml
          # F8: register the home-screen widget receiver
          sed -i 's|</application>|    <receiver android:name="com.example.moeco.MoEcoWidgetProvider" android:exported="false">\n        <intent-filter>\n            <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\n        </intent-filter>\n        <meta-data android:name="android.appwidget.provider" android:resource="@xml/moeco_widget_info"/>\n    </receiver>\n    </application>|' android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId\|minSdk' android/app/build.gradle.kts
          grep -n 'android:label\|uses-permission' android/app/src/main/AndroidManifest.xml
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build universal release APK (works on 32-bit and 64-bit phones)
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Build release APKs per ABI
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk moeco-flutter-universal.apk
          cp app-armeabi-v7a-release.apk moeco-flutter-armeabi-v7a.apk
          cp app-arm64-v8a-release.apk moeco-flutter-arm64-v8a.apk
          cp app-x86_64-release.apk moeco-flutter-x86_64.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moeco-flutter-release
          path: flutter/build/app/outputs/flutter-apk/moeco-flutter-*.apk
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-preview
          name: MoEco Flutter preview
          body: |
            MoEco Flutter app preview (release build; signed with the debug key for sideloading).
            Not sure which file? Get moeco-flutter-universal.apk - it works on almost every Android phone (Android 5.0+, 32-bit and 64-bit).
            Smaller per-ABI APKs: most modern phones = arm64-v8a, older 32-bit phones = armeabi-v7a, emulators = x86_64.
            Rebuilt automatically on every change under flutter/.
          files: flutter/build/app/outputs/flutter-apk/moeco-flutter-*.apk
